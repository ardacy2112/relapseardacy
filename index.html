<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>PS5-Relapse - by ardacy2112</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: #050505;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      text-align: center;
      width: 100%;
      padding: 20px;
    }
    h1 {
      font-size: 3.5rem;
      letter-spacing: 8px;
      color: #00ff66;
      text-shadow: 0 0 15px rgba(0, 255, 102, 0.7), 0 0 30px rgba(0, 255, 102, 0.4);
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .author {
      font-size: 1.2rem;
      color: #88ffbb;
      margin-bottom: 40px;
      letter-spacing: 3px;
      text-shadow: 0 0 8px rgba(136, 255, 187, 0.5);
    }
    .jb-btn {
      background: #000;
      color: #00ff66;
      border: 2px solid #00ff66;
      padding: 20px 50px;
      font-size: 1.5rem;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
      transition: all 0.2s ease-in-out;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .jb-btn:hover {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 35px rgba(0, 255, 102, 0.9);
      transform: scale(1.05);
    }
    .jb-btn:active {
      transform: scale(0.98);
    }
    #console {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #00cc55;
      max-width: 650px;
      text-align: left;
      width: 100%;
      max-height: 140px;
      overflow-y: auto;
      padding: 12px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px dashed #00ff66;
      border-radius: 6px;
    }
    footer {
      padding: 15px;
      font-size: 0.9rem;
      color: #00aa44;
      letter-spacing: 1px;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.3);
    }

    /* --- PS5 SİSTEM BİLDİRİM KARTI (SAĞ ÜST) --- */
    #ps5-notification {
      position: fixed;
      top: 20px;
      right: -450px; /* Başlangıçta ekranın dışında gizli */
      background: rgba(22, 22, 22, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 14px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 999999;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      gap: 14px;
      transition: right 0.5s cubic-bezier(0.1, 1, 0.1, 1);
    }
    #ps5-notification.show {
      right: 20px; /* Başarılı olunca ekrana kayar */
    }
    .ps5-notif-icon {
      width: 34px;
      height: 34px;
      background: #00439c; /* PlayStation Mavisi */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      box-shadow: 0 0 12px rgba(0, 67, 156, 0.6);
      flex-shrink: 0;
    }
    .ps5-notif-text .title {
      font-size: 11px;
      color: #9c9c9c;
      margin-bottom: 2px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .ps5-notif-text .message {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <!-- PS5 Tarzı Bildirim HTML -->
  <div id="ps5-notification">
    <div class="ps5-notif-icon">🎮</div>
    <div class="ps5-notif-text">
      <div class="title">RELAPSE Exploit</div>
      <div class="message">Now play has no limits</div>
    </div>
  </div>

  <div class="container">
    <h1>R E L A P S E</h1>
    <div class="author">by ardacy2112</div>
    
    <button class="jb-btn" id="jailbreakBtn">JAILBREAK</button>
    
    <div id="console"></div>
  </div>

  <footer>
    made with love by ardacy2112
  </footer>

  <!-- Orijinal Relapse Scriptleri -->
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>

  <script>
    // Bildirimi tetikleyen fonksiyon
    function showPS5Notification() {
      const notif = document.getElementById('ps5-notification');
      notif.classList.add('show');
      
      // İsteğe bağlı: 6 saniye sonra bildirimi gizle
      setTimeout(() => {
        notif.classList.remove('show');
      }, 6000);
    }

    // Butona basıldığında tetikleme
    document.getElementById('jailbreakBtn').addEventListener('click', function() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      
      if (isMobile) {
        alert("Bu sayfa sadece PlayStation 5 içindir! Telefonda jailbreak çalıştırılamaz.");
        return;
      }

      this.style.borderColor = '#ffff00';
      this.style.color = '#ffff00';
      this.innerText = 'EXPLOITING...';
      
      if (typeof window.runExploit === 'function') {
        window.runExploit();
      }
    });

    // Konsol çıktısını dinleyerek exploit başarıyla bittiğinde bildirimi otomatik çıkarır
    const consoleDiv = document.getElementById('console');
    const observer = new MutationObserver((mutations) => {
      const text = consoleDiv.innerText.toLowerCase();
      // Relapse başarı veya hazır olma durum metinleri
      if (text.includes('success') || text.includes('done') || text.includes('jailbreak') || text.includes('welcome')) {
        showPS5Notification();
        observer.disconnect(); // Bir kez tetiklenmesi yeterli
      }
    });
    observer.observe(consoleDiv, { childList: true, subtree: true, characterData: true });
  </script>
</body>
</html>
