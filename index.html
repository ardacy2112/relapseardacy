<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>PS5-Relapse - by ardacy2112</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background: #050505;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      text-align: center;
      width: 100%;
      padding: 20px;
    }
    h1 {
      font-size: 3.5rem;
      letter-spacing: 8px;
      color: #00ff66;
      text-shadow: 0 0 15px rgba(0, 255, 102, 0.7), 0 0 30px rgba(0, 255, 102, 0.4);
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .author {
      font-size: 1.2rem;
      color: #88ffbb;
      margin-bottom: 40px;
      letter-spacing: 3px;
      text-shadow: 0 0 8px rgba(136, 255, 187, 0.5);
    }
    .jb-btn {
      background: #000;
      color: #00ff66;
      border: 2px solid #00ff66;
      padding: 20px 50px;
      font-size: 1.5rem;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
      transition: all 0.2s ease-in-out;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .jb-btn:hover {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 35px rgba(0, 255, 102, 0.9);
      transform: scale(1.05);
    }
    .jb-btn:active {
      transform: scale(0.98);
    }
    #console {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #00cc55;
      max-width: 650px;
      text-align: left;
      width: 100%;
      max-height: 140px;
      overflow-y: auto;
      padding: 12px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px dashed #00ff66;
      border-radius: 6px;
    }
    footer {
      padding: 15px;
      font-size: 0.9rem;
      color: #00aa44;
      letter-spacing: 1px;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>R E L A P S E</h1>
    <div class="author">by ardacy2112</div>
    
    <button class="jb-btn" id="jailbreakBtn">JAILBREAK</button>
    
    <div id="console"></div>
  </div>

  <footer>
    made with love by ardacy2112
  </footer>

  <!-- Orijinal script dosyaların tam yerinde duruyor -->
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>

  <script>
    // Telefonda girildiğinde patlamasın, PS5'te ise butona basınca tetiklensin
    document.getElementById('jailbreakBtn').addEventListener('click', function() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      
      if (isMobile) {
        alert("Bu sayfa sadece PlayStation 5 içindir! Telefonda jailbreak çalıştırılamaz.");
        return;
      }

      this.style.borderColor = '#ffff00';
      this.style.color = '#ffff00';
      this.innerText = 'EXPLOITING...';
      
      // site.js veya main.js içindeki tetikleyicileri devreye sokar
      if (typeof window.runExploit === 'function') {
        window.runExploit();
      }
    });
  </script>
</body>
</html>
